services:
  inr-gateway:
    image: runway-inr-gateway:testnet
    ports:
      - "8791:8791"
    environment:
      - INR_PROVIDER
      - MOCK_WEBHOOK_SECRET
      - RAZORPAY_KEY_ID
      - RAZORPAY_KEY_SECRET
      - RAZORPAY_WEBHOOK_SECRET
      - RAZORPAYX_ACCOUNT_NUMBER
      - PUBLIC_URL
      - SPONSOR_ACCOUNT_ID
      - SPONSOR_PRIVATE_KEY
      - AGENT_DERIVATION_PATH
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
