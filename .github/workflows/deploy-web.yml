name: Deploy web (Vercel)

# Deploys apps/web to Vercel production from GitHub Actions. Use EITHER this workflow OR Vercel's own
# Git integration, not both (they would deploy twice):
#   - Vercel Git integration (simplest): connect the repo in Vercel and leave this workflow off.
#   - This workflow: set the repository variable DEPLOY_WEB_WITH_ACTIONS=true, add the secrets
#     VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and turn off "Automatic deployments" in Vercel.
# The Vercel project must have Root Directory = apps/web; NEXT_PUBLIC_* values come from the Vercel
# project's Environment Variables (vercel pull reads them).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/sdk/**"
      - "packages/config/**"
      - "packages/fx/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_WEB_WITH_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: npm install --global vercel@65.14.0
      - name: Pull Vercel settings and environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deploy-url.txt
      - name: Summary
        run: echo "Deployed $(tail -1 deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"
