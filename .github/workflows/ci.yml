name: CI

# Fast checks on every pull request into main and every push to main. These are the checks to
# require in the branch ruleset. The slow sandbox suite lives in sandbox.yml (path-filtered).
# No secrets are needed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NEAR_VERSION: cargo-near-v0.23.0
  PNPM_VERSION: 10.8.0
  NODE_VERSION: "22"

jobs:
  contracts:
    name: Contracts (wasm build, fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.95.0 for native builds/tests; wasm is built with 1.86.0
      # because near-sdk 5.26.1 (pinned for shade-attestation) targets that VM (see docs/SPIKES.md).
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.95.0 --profile minimal -c rustfmt -c clippy -t wasm32-unknown-unknown
          rustup toolchain install 1.86.0 --profile minimal -t wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          cargo near --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The factory embeds the settlement wasm, so clippy and tests need res/ first.
      - name: Build contracts to wasm
        run: bash scripts/build-contracts.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (no sandbox)
        run: cargo test --workspace --exclude runway-integration-tests

  typescript:
    name: TypeScript (typecheck, tests, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ts
      - run: pnpm format:check
