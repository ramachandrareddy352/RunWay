[package]
name = "runway-settlement"
description = "Per-merchant settlement account: zero access keys, splits every inflow and routes it to the credit contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Failure injection for integration tests only. Never enabled in deployed builds.
test-hooks = []

[dependencies]
near-sdk = { workspace = true }
runway-shared = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
